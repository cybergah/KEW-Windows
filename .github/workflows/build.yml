name: Build

# Every push: build the UI.
# Manual run or a "v*" tag: also package the Windows installer + portable exe.
# A "v*" tag additionally publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build UI
        run: npm run build

      - name: Fetch yt-dlp + ffmpeg
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./tools/fetch-resources.ps1

      - name: Package (installer + portable)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: kew-windows
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kew-windows
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
